<div class="sticky top-0 z-50 w-full mt-6">
  <mat-toolbar class="flex items-center justify-between w-full">

    <!-- Hamburger: phones only -->
    <button mat-icon-button class="md:hidden" [matMenuTriggerFor]="menu" aria-label="Open navigation menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" class="size-6">
        <path d="M3 6h18M3 12h18M3 18h18" />
      </svg>
    </button>

    <!-- Inline links: md and up -->
    <nav class="hidden md:flex flex-1 items-center justify-between">
      @for (navItem of navbarItems; track $index) {
        <a [href]="'#' + navItem.hrefId" mat-button>{{ navItem.title }}</a>
      }
    </nav>

    <!-- Dark mode toggle -->
    <button mat-icon-button (click)="toggleTheme()"
            [attr.aria-label]="isDark() ? 'Switch to light mode' : 'Switch to dark mode'">
      @if (isDark()) {
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-6">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
        </svg>
      } @else {
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-6">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
        </svg>
      }
    </button>
  </mat-toolbar>

  <mat-menu #menu="matMenu">
    @for (navItem of navbarItems; track $index) {
      <a mat-menu-item [href]="'#' + navItem.hrefId">{{ navItem.title }}</a>
    }
  </mat-menu>
</div>
